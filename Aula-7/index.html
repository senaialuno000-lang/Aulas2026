<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
        <link rel="icon" href="https://faint-apricot-07t0j9tdfz.edgeone.app/crisanta.jpg">
    </head>
    <body>
        <h1>Tabela Incrível</h1>
        <!-- Criando uma Tabela -->
        <table border="5">
            <!-- Cabeçalho da Tabela -->
            <thead>
                <tr>
                    <th>Nome</th>
                    <th>Item</th>
                    <th>Quantidade</th>
                    <th>Preço</th>
                </tr>
            </thead>
            <!-- Corpo da Tabela -->
            <tbody>
                <!-- Criando uma Linha -->
                <tr>
                    <!-- Criando uma Coluna -->
                    <td>Nike</td>
                    <td>Camisa</td>
                    <td>1</td>
                    <td>R$50</td>
                </tr>
                <tr>
                    <!-- Criando uma Coluna -->
                    <td rowspan="2">Nike</td>
                    <td>Bermuda</td>
                    <td>1</td>
                    <td>R$200</td>
                </tr>
                <tr>
                    <!-- Criando uma Coluna -->
                    <td>Tenis</td>
                    <td>1</td>
                    <td>R$250</td>
                </tr>
            </tbody>
            <!-- Rodape da Tabela -->
            <tfoot>
                <tr>
                    <!-- Criando uma Coluna -->
                    <td colspan="4">Todos os Direitos Reservados &copy;</td>
                </tr>
            </tfoot>
        </table>
    </body>
</html>
